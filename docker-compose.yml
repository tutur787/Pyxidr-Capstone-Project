services:

  optimization:
    build: .
    environment:
      - GRB_WLSACCESSID=${GRB_WLSACCESSID:-}
      - GRB_WLSSECRET=${GRB_WLSSECRET:-}
      - GRB_LICENSEID=${GRB_LICENSEID:-}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_AGENT_MODEL=${HF_AGENT_MODEL:-}
      - GCS_INPUT_BUCKET=${GCS_INPUT_BUCKET:-}
      - GCS_OUTPUT_BUCKET=${GCS_OUTPUT_BUCKET:-}
      - DATA_INPUT_DIR=/app/data/input
      - DATA_OUTPUT_DIR=/app/data/output
    volumes:
      - ./data/output:/app/data/output
      - ~/.config/gcloud:/root/.config/gcloud:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - GRB_WLSACCESSID=${GRB_WLSACCESSID:-}
      - GRB_WLSSECRET=${GRB_WLSSECRET:-}
      - GRB_LICENSEID=${GRB_LICENSEID:-}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCS_INPUT_BUCKET=${GCS_INPUT_BUCKET:-}
      - GCS_OUTPUT_BUCKET=${GCS_OUTPUT_BUCKET:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_AGENT_MODEL=${HF_AGENT_MODEL:-}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro

  frontend:
    build: ./frontend
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    ports:
      - "4173:4173"
    depends_on:
      - backend

  notebook:
    build: .
    profiles: ["notebook"]
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
        --NotebookApp.token=''
    environment:
      - GRB_WLSACCESSID=${GRB_WLSACCESSID:-}
      - GRB_WLSSECRET=${GRB_WLSSECRET:-}
      - GRB_LICENSEID=${GRB_LICENSEID:-}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCS_INPUT_BUCKET=${GCS_INPUT_BUCKET:-}
      - GCS_OUTPUT_BUCKET=${GCS_OUTPUT_BUCKET:-}
    ports:
      - "8888:8888"
    volumes:
      - ./data/input:/app/data/input:ro
      - ./data/output:/app/data/output
      - .:/app/workspace
      - ~/.config/gcloud:/root/.config/gcloud:ro
